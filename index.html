        // 初始化 BGM (Tone.js)
        async function initBGM() {
            if (bgmSequence) return;
            bgmSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            bgmSynth.volume.value = -12; // 音量微調
            
            // 輕快簡單的五聲音階旋律
            const melody = [
                {"time": "0:0", "note": ["C4", "E4"]}, {"time": "0:1", "note": "G4"},
                {"time": "0:2", "note": ["C4", "E4"]}, {"time": "0:3", "note": "A4"},
                {"time": "1:0", "note": ["D4", "F4"]}, {"time": "1:1", "note": "A4"},
                {"time": "1:2", "note": ["B3", "D4"]}, {"time": "1:3", "note": "G4"}
            ];
            
            bgmSequence = new Tone.Part((time, value) => {
                bgmSynth.triggerAttackRelease(value.note, "8n", time);
            }, melody);
            
            bgmSequence.loop = true;
            bgmSequence.loopEnd = "2m";
            Tone.Transport.bpm.value = 110;
        }

        function toggleBGM() {
            isBgmEnabled = !isBgmEnabled;

            } else {
                btnIcon.className = 'fa-solid fa-music text-slate-400';
                Tone.Transport.pause();
            }
        }

        document.getElementById('btn-toggle-bgm').addEventListener('click', () => {

<!-- ... existing code ... -->
        function showReviewScreen() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('review-container').style.display = 'flex';
            
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';
            
            // 將題目依照情境(situation)進行分組與排序
            const groupedQuestions = {};
            currentQuestions.forEach(q => {
                if (!groupedQuestions[q.situation]) {
                    groupedQuestions[q.situation] = [];
                }
                groupedQuestions[q.situation].push(q);
            });
            
            let rowIndex = 0;
            // 遍歷分組後的情境來渲染 (同情境的會排在一起)
            for (const situation in groupedQuestions) {
                groupedQuestions[situation].forEach(q => {
                    const row = document.createElement('div');
                    row.className = `grid grid-cols-2 p-4 ${rowIndex % 2 === 0 ? 'bg-white' : 'bg-slate-50'} hover:bg-blue-50 transition-colors`;
                    
                    const idiomCol = document.createElement('div');
                    idiomCol.className = 'text-center text-xl font-bold tracking-widest';
                    // 複習畫面也套用相同的專屬顏色
                    idiomCol.style.color = q.colorTheme.text;
                    idiomCol.textContent = q.idiom;
                    
                    const situationCol = document.createElement('div');
                    situationCol.className = 'text-center text-lg text-slate-700 flex items-center justify-center';
                    
                    const arrow = document.createElement('i');
                    arrow.className = 'fa-solid fa-arrow-right-long text-slate-300 mx-3';
                    
                    const textSpan = document.createElement('span');
                    textSpan.textContent = q.situation;
                    
                    situationCol.appendChild(arrow);
                    situationCol.appendChild(textSpan);
                    
                    row.appendChild(idiomCol);
                    row.appendChild(situationCol);
                    
                    reviewList.appendChild(row);
                    rowIndex++;
                });
            }
        }

        // 排行榜與 LocalStorage 邏輯
        const LEADERBOARD_KEY = 'idiom_game_leaderboard';
        const MAX_RECORDS = 20; // 最多保留 20 筆紀錄
        
        function saveToLeaderboard() {
            let records = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
            
            const newRecord = {
                id: Date.now().toString(),
                name: playerName,
                time: timeElapsedInSeconds,
                hearts: currentHearts,
                maxHearts: maxHearts,
                date: new Date().toLocaleString()
            };
            
            records.push(newRecord);
            // 排序：先比時間(越短越好)，再比剩餘愛心(越多越好)
            records.sort((a, b) => {
                if (a.time !== b.time) return a.time - b.time;
                return b.hearts - a.hearts;
            });
            
            // 限制筆數
            if (records.length > MAX_RECORDS) {
                records = records.slice(0, MAX_RECORDS);
            }
            
            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(records));
        }

        function showLeaderboard() {
            document.getElementById('leaderboard-container').style.display = 'flex';
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            const records = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
            
            if (records.length === 0) {
                list.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">目前尚無紀錄，趕快成為第一個挑戰者吧！</td></tr>';
                return;
            }
            
            records.forEach((record, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0';
                
                // 名次徽章 (前三名給予特別 Icon)
                let rankHtml = `<span class="font-bold text-slate-600">${index + 1}</span>`;
                if (index === 0) rankHtml = `<i class="fa-solid fa-medal text-yellow-400 text-2xl"></i>`;
                else if (index === 1) rankHtml = `<i class="fa-solid fa-medal text-slate-400 text-xl"></i>`;
                else if (index === 2) rankHtml = `<i class="fa-solid fa-medal text-amber-700 text-xl"></i>`;
                
                const minutes = Math.floor(record.time / 60).toString().padStart(2, '0');
                const seconds = (record.time % 60).toString().padStart(2, '0');
                
                // 愛心顯示
                let heartsHtml = '';
                for(let i=0; i<record.maxHearts; i++) {
                    heartsHtml += `<i class="fa-solid fa-heart ${i < record.hearts ? 'text-red-500' : 'text-slate-200'} text-sm"></i>`;
                }

                tr.innerHTML = `
                    <td class="p-4 text-center">${rankHtml}</td>
                    <td class="p-4 font-bold text-slate-700">
                        ${record.name}
                        <div class="text-xs text-slate-400 font-normal">${record.date}</div>
                    </td>
                    <td class="p-4 text-center font-mono text-blue-600">${minutes}:${seconds}</td>
                    <td class="p-4 text-center space-x-1 whitespace-nowrap">${heartsHtml}</td>
                    <td class="p-4 text-center">
                        <button class="text-slate-400 hover:text-red-500 transition-colors p-2" onclick="deleteRecord('${record.id}')" title="刪除此紀錄">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }
        
        // 供單筆刪除按鈕呼叫
        window.deleteRecord = function(id) {
            Swal.fire({
                title: '確定刪除？',
                text: "刪除後將無法恢復此紀錄！",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: '是的，刪除',
                cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    let records = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
                    records = records.filter(r => r.id !== id);
                    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(records));
                    showLeaderboard(); // 重新渲染排行榜
                }
            });
        };

        function clearLeaderboard() {
            Swal.fire({
                title: '清空排行榜？',
                text: "這將會刪除所有的榮譽紀錄，確定嗎？",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: '是的，全部清空',
                cancelButtonText: '取消'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem(LEADERBOARD_KEY);
                    showLeaderboard();
                    Swal.fire('已清空', '排行榜紀錄已全數刪除。', 'success');
                }
            });
        }
